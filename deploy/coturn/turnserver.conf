# coturn for Chirp's public network: STUN only (docs/relay.md, STUN and TURN).
#
# A downloaded Chirp that uses relay.usechirp.app also uses this server as its
# STUN server (cmd/chirp, defaultICE). STUN tells each end its public address,
# which is enough to connect across most NATs. It carries no session data.
#
# TURN stays off until the relay hands out per-session credentials
# (barahn/remotekit#64, docs/stun-turn.md *Credentials*): a credential built
# into every binary would let anyone who unpacks one relay through this server.
#
# SPDX-License-Identifier: AGPL-3.0-only
# Copyright (C) 2026 Fabrintek Engenharia Digital Ltda

# 3478 over UDP and TCP. Forward both to this machine.
listening-port=3478

# Answer STUN binding requests and ignore every TURN request.
stun-only

# RFC 5389 fingerprints, which WebRTC stacks send and expect.
fingerprint

# No admin console, no TLS (STUN here is plain, as WebRTC's is), no
# multicast, and nothing written but warnings to the journal.
no-cli
no-tls
no-dtls
no-multicast-peers
syslog
simple-log
