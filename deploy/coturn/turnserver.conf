# coturn for Chirp's public network: STUN, and TURN with short-lived
# credentials that only the relay hands out (docs/relay.md, STUN and TURN).
#
# A downloaded Chirp that uses relay.usechirp.app also uses this server as its
# STUN server (cmd/chirp, defaultICE). When two Chirps cannot reach each other
# directly, the owner gets two TURN credentials from the relay, good for five
# minutes each, and both ends relay through this server
# (docs/network-paths-proposal.md, part 1).
#
# install.sh fills in the placeholders between at signs; this file is a
# template and is never copied as it is.
#
# SPDX-License-Identifier: AGPL-3.0-only
# Copyright (C) 2026 Fabrintek Engenharia Digital Ltda

# 3478 over UDP and TCP. Forward both to this machine.
listening-port=3478

# RFC 5389 fingerprints, which WebRTC stacks send and expect.
fingerprint

# Credentials in the TURN REST format: "<expiry>:<id>" and an HMAC-SHA1 of it
# under this secret, which the relay holds too (-turn-secret-file). coturn
# checks the expiry only when an allocation is opened, so a session outlives
# its five-minute credential.
use-auth-secret
static-auth-secret=@SECRET@
realm=chirp

# Behind NAT, the public address and the one this machine has, so coturn
# announces where peers can reach it. Empty when the machine is public.
@EXTERNAL_IP@

# The relay ports: a narrow range, so every NAT in front forwards a few
# hundred UDP ports rather than 16,384. Each relayed session takes two.
min-port=@MIN_PORT@
max-port=@MAX_PORT@

# At most two allocations per credential: each end of a session uses its
# own credential once, and a second allocation covers a network change.
user-quota=2

# Bytes per second. max-bps bounds one allocation: VP8 tops out at 8 Mbit/s,
# so 10 Mbit/s with headroom. bps-capacity bounds the whole server: about
# half of the uplink's measured upload floor, not its peak or its contract,
# since the relay and everything else on the link share it.
max-bps=1250000
bps-capacity=@BPS_CAPACITY@

# A TURN server relays to whatever address a client names. Refuse private,
# shared and link-local ranges, so a credential cannot reach the network this
# server sits in. coturn refuses loopback on its own.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No admin console, no TLS (STUN and TURN here are plain, as WebRTC's media is
# encrypted end to end anyway), and nothing written but warnings to the
# journal.
no-cli
no-tls
no-dtls
syslog
simple-log
