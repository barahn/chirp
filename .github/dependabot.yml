version: 2

updates:
  # Go modules. Chirp's dependency surface is deliberately tiny, so updates are
  # grouped: one pull request a week that CI can judge as a whole, rather than
  # five that each need the licence gate and govulncheck run separately.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:23"
    open-pull-requests-limit: 5
    target-branch: main
    commit-message:
      prefix: "build(deps)"
      include: scope
    labels: [ dependencies, go ]
    groups:
      go-minor-and-patch:
        patterns: [ "*" ]
        update-types: [ minor, patch ]
    # A major bump is a design decision, not a bump: it stays its own pull
    # request so the breaking change gets read.

  # GitHub Actions. Every action in this repository is pinned to a commit SHA,
  # which is the only pin a tag cannot be moved out from under -- and which
  # also means nothing updates unless Dependabot rewrites the SHA. Without this
  # block, pinning quietly becomes freezing on a known-vulnerable action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:41"
    open-pull-requests-limit: 5
    target-branch: main
    commit-message:
      prefix: "ci(deps)"
    labels: [ dependencies, github-actions ]
    groups:
      actions-all:
        patterns: [ "*" ]

  # The relay's container image (deploy/container/Containerfile). Its base
  # images are pinned by digest for the same reason the actions are pinned by
  # SHA, and need the same rewriting. The Caddy image in
  # deploy/podman/caddy.container is a Quadlet unit Dependabot cannot read;
  # docs/relay.md says how to update it.
  - package-ecosystem: docker
    directory: /deploy/container
    schedule:
      interval: weekly
      day: monday
      time: "06:59"
    open-pull-requests-limit: 5
    target-branch: main
    commit-message:
      prefix: "build(deps)"
      include: scope
    labels: [ dependencies, docker ]
    groups:
      images-all:
        patterns: [ "*" ]
