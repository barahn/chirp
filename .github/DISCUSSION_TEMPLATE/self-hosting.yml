labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Never post a Chirp code or link**, not even an expired one, or a password, token or TURN credential. Remove them from any log, setting or screenshot you paste. Discussions are public.
        >
        > Anything that could weaken PIN generation or redemption, the consent prompt or the session lifecycle is security-sensitive even when it looks cosmetic. Email [security@fabrintek.com.br](mailto:security@fabrintek.com.br) instead of posting it here; see [SECURITY.md](https://github.com/barahn/chirp/blob/main/SECURITY.md).
  - type: markdown
    attributes:
      value: |
        Before asking, [docs/stun-turn.md](https://github.com/barahn/chirp/blob/main/docs/stun-turn.md) covers bringing your own STUN/TURN, and the README's *Try it from source* covers the relay.
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Where the relay and STUN/TURN run, how each Chirp reaches them (`CHIRP_RELAY`, NAT, firewall, proxy), and the operating systems involved. Replace real hostnames and IP addresses if you prefer.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happens
      description: What you expected and what you get. Relay or client logs help; redact codes, links and credentials, including TURN secrets.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chirp version
      description: The commit or tag you built.
      placeholder: main @ 7b7fa78
