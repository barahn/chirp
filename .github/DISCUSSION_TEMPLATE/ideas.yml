labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Never post a Chirp code or link**, not even an expired one, or a password, token or TURN credential. Remove them from any log, setting or screenshot you paste. Discussions are public.
        >
        > Anything that could weaken PIN generation or redemption, the consent prompt or the session lifecycle is security-sensitive even when it looks cosmetic. Email [security@fabrintek.com.br](mailto:security@fabrintek.com.br) instead of posting it here; see [SECURITY.md](https://github.com/barahn/chirp/blob/main/SECURITY.md).
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like Chirp to do, and what would it make possible? Questions about how Chirp itself should work fit better in Design.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Who it helps
      description: Who is helping whom, on what machines. Real situations help prioritise.
  - type: markdown
    attributes:
      value: |
        Chirp is the support product; capture, encoding, input and transport live in [remotekit](https://github.com/barahn/remotekit). [ECOSYSTEM.md](https://github.com/barahn/chirp/blob/main/ECOSYSTEM.md) says which repository an idea belongs in.
