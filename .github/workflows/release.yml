name: Release

# Builds the binaries a release ships and attaches them to it (#69): cmd/chirp
# for Linux and Windows, cmd/chirp-relay for Linux, a notices bundle, and a
# SHA256SUMS file signed with Sigstore. It runs when a release is published,
# like sbom.yml, so the notes stay the maintainer's to write: tag, publish the
# release, and this fills it in.
#
# cmd/chirp needs cgo (Fyne), and cgo does not cross-compile, so each system
# builds on its own runner, as ci.yml's "Build cmd/chirp" matrix does. The
# binaries are not code-signed yet: Authenticode and Apple notarization need
# certificates Fabrintek does not hold. macOS waits for remotekit to capture
# and inject there (barahn/remotekit#72).
#
# Asset names carry no version, so releases/latest/download/<name> always
# serves the newest build to the site's download buttons.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (it must exist and have a release)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  linux:
    name: Build for Linux
    # The oldest supported Ubuntu: a binary linked against its glibc (2.35)
    # also runs on Debian 12 and every newer Ubuntu.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install the GL, X11 and Wayland headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o dist/chirp-linux-amd64 ./cmd/chirp
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/chirp-relay-linux-$arch" ./cmd/chirp-relay
          done
          file dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  windows:
    name: Build for Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # -H windowsgui: double-clicked, Chirp opens its window without a console
      # behind it. What it would print there it says in a message box when it
      # matters (cmd/chirp/internal/alert).
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w -H windowsgui' -o dist/chirp-windows-amd64.exe ./cmd/chirp

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  publish:
    name: Sign and attach
    needs: [ linux, windows ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write     # attach assets to the release
      id-token: write     # Sigstore's keyless signing, and the attestations
      attestations: write # build provenance for each binary
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # The binaries embed BSD-, MIT- and Apache-licensed code and fonts under
      # the OFL and the Bitstream Vera licence, whose notices must travel with
      # them. THIRD_PARTY_NOTICES.md reproduces every one.
      - name: Bundle the licence notices
        run: |
          mkdir -p notices
          cp LICENSE THIRD_PARTY_NOTICES.md cmd/chirp/internal/warm/fonts/OFL-*.txt notices/
          (cd notices && zip -q -9 ../dist/chirp-notices.zip ./*)

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * | tee SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature binds SHA256SUMS to this workflow at this tag,
      # through GitHub's OIDC token, with no key to keep.
      - name: Sign the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/chirp-linux-amd64
            dist/chirp-windows-amd64.exe
            dist/chirp-relay-linux-amd64
            dist/chirp-relay-linux-arm64

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
