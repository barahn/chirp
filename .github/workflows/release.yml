name: Release

# Builds the binaries a release ships and attaches them to it (#69): cmd/chirp
# for Linux, Windows and macOS, cmd/chirp-relay for Linux, a notices bundle,
# and a SHA256SUMS file signed with Sigstore. It runs when a release is
# published, like sbom.yml, so the notes stay the maintainer's to write: tag,
# publish the release, and this fills it in.
#
# cmd/chirp needs cgo (Fyne), and cgo does not cross-compile, so each system
# builds on its own runner, as ci.yml's "Build cmd/chirp" matrix does. The
# Windows binary is not code-signed yet: Authenticode needs a certificate
# Fabrintek does not hold. Chirp.app is signed with Fabrintek's self-signed
# certificate, whose key lives only in the `release` environment, so that
# macOS keeps its permissions across updates (#51). It is not notarized.
#
# Asset names carry no version, so releases/latest/download/<name> always
# serves the newest build to the site's download buttons.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (it must exist and have a release)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  linux:
    name: Build for Linux
    # The oldest supported Ubuntu: a binary linked against its glibc (2.35)
    # also runs on Debian 12 and every newer Ubuntu.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install the GL, X11 and Wayland headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o dist/chirp-linux-amd64 ./cmd/chirp
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/chirp-relay-linux-$arch" ./cmd/chirp-relay
          done
          file dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  windows:
    name: Build for Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # -H windowsgui: double-clicked, Chirp opens its window without a console
      # behind it. What it would print there it says in a message box when it
      # matters (cmd/chirp/internal/alert).
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w -H windowsgui' -o dist/chirp-windows-amd64.exe ./cmd/chirp

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  # One universal Chirp.app, amd64 and arm64, in a zip: a Mac of either kind
  # takes the same download. The runner is arm64, and Apple's clang builds
  # the amd64 half there too.
  macos:
    name: Build for macOS
    runs-on: macos-15
    timeout-minutes: 30
    # The signing key's secrets live only in this environment, which only
    # v* tags may deploy to.
    environment: release
    env:
      # What remotekit's screen capture needs (ScreenCaptureKit), and what
      # Info.plist declares: scripts/macapp's minimumSystemVersion.
      MACOSX_DEPLOYMENT_TARGET: '12.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p build dist
          GOARCH=amd64 CC='clang -arch x86_64' go build -trimpath -ldflags='-s -w' -o build/chirp-amd64 ./cmd/chirp
          GOARCH=arm64 CC='clang -arch arm64' go build -trimpath -ldflags='-s -w' -o build/chirp-arm64 ./cmd/chirp
          lipo -create -output build/chirp-universal build/chirp-amd64 build/chirp-arm64
          lipo -info build/chirp-universal
          vtool -show-build build/chirp-universal | grep minos

      - name: Bundle
        run: |
          go run ./scripts/macapp -tag "$TAG" -bin build/chirp-universal -out build/Chirp.app
          plutil -lint build/Chirp.app/Contents/Info.plist

      # The designated requirement must come out as
      # identifier "app.usechirp.chirp" and certificate leaf = H"<sha1>",
      # which the script checks. MACOS_SIGNING_SHA1 is public; it is the
      # fingerprint docs/release.md publishes.
      - name: Sign
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_SIGNING_SHA1: ${{ vars.MACOS_SIGNING_SHA1 }}
        run: |
          umask 077
          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$MACOS_SIGNING_P12_PASSWORD" > "$RUNNER_TEMP/signing.pass"
          trap 'rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.pass"' EXIT
          ./scripts/sign-macos-app.sh build/Chirp.app "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.pass" "$MACOS_SIGNING_SHA1"

      # ditto keeps what zip would drop (the signature's extended
      # attributes, symlinks). The zip is checked as a Mac would unpack it.
      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Chirp.app dist/chirp-macos-universal.zip
          mkdir -p build/check
          ditto -x -k dist/chirp-macos-universal.zip build/check
          codesign --verify --strict --deep --verbose=2 build/check/Chirp.app
          codesign -d -r- build/check/Chirp.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  publish:
    name: Sign and attach
    needs: [ linux, windows, macos ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write     # attach assets to the release
      id-token: write     # Sigstore's keyless signing, and the attestations
      attestations: write # build provenance for each binary
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # The binaries embed BSD-, MIT- and Apache-licensed code and fonts under
      # the OFL and the Bitstream Vera licence, whose notices must travel with
      # them. THIRD_PARTY_NOTICES.md reproduces every one.
      - name: Bundle the licence notices
        run: |
          mkdir -p notices
          cp LICENSE THIRD_PARTY_NOTICES.md cmd/chirp/internal/warm/fonts/OFL-*.txt notices/
          (cd notices && zip -q -9 ../dist/chirp-notices.zip ./*)

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * | tee SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature binds SHA256SUMS to this workflow at this tag,
      # through GitHub's OIDC token, with no key to keep.
      - name: Sign the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/chirp-linux-amd64
            dist/chirp-windows-amd64.exe
            dist/chirp-macos-universal.zip
            dist/chirp-relay-linux-amd64
            dist/chirp-relay-linux-arm64

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
