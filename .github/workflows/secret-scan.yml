name: Secret Scan

# A leaked credential is not a build failure anywhere else in this pipeline:
# the code compiles, the tests pass, and the secret is in the history for good.
# Rotation is the only remedy after the fact, so the gate runs before the merge.
on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  schedule:
    - cron: '41 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Audit mode: harden-runner records what each job talks to without
      # blocking it. Read the egress report on a few green runs, then turn this
      # to `block` with an allowlist -- flipping it blind breaks the module
      # proxy, the linter and the action downloads all at once.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: a secret removed by a later commit is still published.
          # Both ends of the range have to be local for the PR scan below.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      # Run gitleaks as a pinned Go module rather than through its action. The
      # action's v3 is licence-gated for organisations, and this keeps the tool
      # pinned the same way gosec and govulncheck already are.
      - name: Scan commits (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.0 git \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact --no-banner --exit-code 1 .

      - name: Scan working tree and history
        if: github.event_name != 'pull_request'
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.0 dir . \
            --redact --no-banner --exit-code 1
          go run github.com/zricethezav/gitleaks/v8@v8.30.0 git \
            --redact --no-banner --exit-code 1 .
