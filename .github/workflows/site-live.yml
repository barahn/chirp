name: Website (live)

# Checks that usechirp.app serves the site as the repository has it: pages and
# scripts byte for byte, and the headers in .cloudflare/rulesets/. Cloudflare
# sits in front of GitHub Pages, and a dashboard setting can start rewriting
# the pages without any change here (email obfuscation did, on 2026-10-12).
#
# This runs weekly for settings nobody deployed, and manually on demand.
# Post-deploy verification runs directly in pages.yml.
# See docs/devsecops.md.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: usechirp.app matches the repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check
        run: ./scripts/check-live-site.sh
