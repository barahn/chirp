name: Create Release PR (Develop -> Main)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-pr:
    name: Create or update release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Create or Update Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main

          COMMITS=$(git log origin/main..origin/develop --oneline)
          if [ -z "$COMMITS" ]; then
            echo "No commits ahead on develop compared to main. Nothing to do."
            exit 0
          fi

          {
            echo "## 🚀 Automated Release PR"
            echo ""
            echo "This PR was automatically generated by \`github-actions[bot]\` to merge \`develop\` into \`main\`."
            echo ""
            echo "### 📝 Changelog"
            git log origin/main..origin/develop --no-merges --pretty=format:"* %s (%h)"
            echo ""
            echo ""
            echo "**Required**: A human must review and approve this Pull Request before it can be merged."
          } > pr_body.txt

          PR_EXISTS=$(gh pr list --base main --head develop --state open --json number -q '.[0].number')

          if [ -n "$PR_EXISTS" ]; then
            echo "Updating existing PR #$PR_EXISTS"
            gh pr edit "$PR_EXISTS" --title "🚀 Release: Develop -> Main" --body-file pr_body.txt
          else
            echo "Creating new PR"
            gh pr create \
              --base main \
              --head develop \
              --title "🚀 Release: Develop -> Main" \
              --body-file pr_body.txt
          fi
