name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

# Least privilege by default. `main` is the primary branch and takes
# pull requests from forks, where the default read/write token would be handed
# to unreviewed code. Any job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Test & SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Audit mode: harden-runner records what each job talks to without
      # blocking it. Read the egress report on a few green runs, then turn this
      # to `block` with an allowlist -- flipping it blind breaks the module
      # proxy, the linter and the action downloads all at once.
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        # An observer must not be able to fail the build it observes. In audit
        # mode this step blocks nothing, so if the agent cannot start -- as on a
        # private repository its tier does not cover -- the job goes on without
        # the egress report rather than going red.
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the DCO commit range have to be local, and nothing is
          # fetched later: persist-credentials is false, so a fetch would
          # prompt for a username and hang the step.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # Without this, '1.26' is whichever 1.26 patch the runner image has
          # cached, which can lag a security release by days. govulncheck
          # below then fails on standard-library fixes that are already out.
          check-latest: true

      # cmd/chirp draws its window with Fyne, which needs cgo and the system's
      # OpenGL, X11 and Wayland headers to build (HANDOFF §5.6). Every later
      # step that loads cmd/chirp -- build, vet, lint, tests, gosec,
      # govulncheck -- compiles it, so the headers go in first.
      - name: Install Fyne's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      # CONTRIBUTING.md requires a DCO Signed-off-by trailer on every commit.
      # Merge commits are exempt: they carry no contribution of their own.
      #
      # Note what this does NOT establish. The DCO certifies the origin of a
      # contribution and the right to submit it; it is not the CLA, and it
      # grants none of the relicensing rights Chirp's dual-licensing depends
      # on. Until CLA acceptance is enforced here, external pull requests are
      # not merged at all -- see CONTRIBUTING.md.
      - name: Validate DCO Sign-off
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Base commit $BASE_SHA is not available locally."
            exit 1
          fi

          MISSING=0
          while read -r sha || [ -n "$sha" ]; do
            [ -z "$sha" ] && continue
            if git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q '[^[:space:]]'; then
              echo "✓ $sha is signed off."
            else
              echo "::error::Commit $sha has no 'Signed-off-by' trailer: $(git show -s --format='%s' "$sha")"
              MISSING=1
            fi
          done < <(git log --no-merges "${BASE_SHA}..${HEAD_SHA:-HEAD}" --pretty=format:"%H")

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::DCO validation failed. Sign your commits with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
          echo "✓ All commits carry a DCO sign-off."

      # Chirp is AGPL, so a copyleft dependency would be license-compatible
      # with it -- and still unacceptable. Fabrintek relicenses Chirp for its
      # proprietary platform on the strength of owning all of Chirp; it owns
      # none of its dependencies. See the script header and LICENSING.md.
      - name: Third-Party License Compliance
        run: |
          git ls-files --error-unmatch THIRD_PARTY_NOTICES.md >/dev/null
          ./scripts/gen-third-party-notices.sh THIRD_PARTY_NOTICES.md
          if ! git diff --exit-code --stat -- THIRD_PARTY_NOTICES.md; then
            echo "::error::THIRD_PARTY_NOTICES.md is out of date. Run ./scripts/gen-third-party-notices.sh and commit the result."
            git diff -- THIRD_PARTY_NOTICES.md
            exit 1
          fi

      - name: Build & Vet
        run: |
          go build ./...
          go vet ./...

      # Everything but cmd/chirp builds without cgo for every platform, and
      # must keep doing so: the relay and the protocol never need a C
      # toolchain. cmd/chirp needs cgo everywhere, so it is built natively by
      # the `binary` job below instead.
      - name: Cross-compile Check (Windows / macOS)
        env:
          CGO_ENABLED: 0
        run: |
          PKGS=$(go list ./... | grep -Ev '/cmd/chirp(/|$)')
          GOOS=windows GOARCH=amd64 go build $PKGS
          GOOS=darwin GOARCH=amd64 go build $PKGS

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-mode: goinstall
          skip-cache: true

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      # The site's pages require Trusted Types, which not every browser
      # enforces, and carry their CSP twice: in a <meta> tag and, through
      # Cloudflare, as a header. This keeps HTML sinks out of site/ and the
      # two policies equal. See docs/devsecops.md.
      - name: Website has no HTML sink, and one CSP
        run: ./scripts/check-site.sh

      # HANDOFF.md's snapshot block is generated from the tree. Checked here
      # rather than committed by a bot: a workflow pushing to main would need a
      # bypass of the branch protection in .github/rulesets/. See docs/branching.md.
      - name: HANDOFF.md snapshot is current
        run: |
          ./scripts/gen-handoff.sh HANDOFF.md
          if ! git diff --exit-code --stat -- HANDOFF.md; then
            echo "::error::HANDOFF.md's snapshot is out of date. Run ./scripts/gen-handoff.sh and commit the result."
            git diff -- HANDOFF.md
            exit 1
          fi

      - name: SAST (gosec)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.1 ./...

      - name: Vulnerability Check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # cmd/chirp on the systems it ships for, each on its own kind of runner:
  # Fyne needs cgo, and cgo does not cross-compile from Linux. Linux itself
  # is covered by the job above. harden-runner observes Linux runners only,
  # so it is not here.
  binary:
    name: Build cmd/chirp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -o chirp-bin ./cmd/chirp

      # The release's macOS packaging, end to end, with a throwaway
      # certificate instead of the release one, whose key CI never sees.
      - name: Bundle and sign Chirp.app with a throwaway certificate
        if: runner.os == 'macOS'
        run: |
          go run ./scripts/macapp -tag v0.0.0-ci -bin chirp-bin -out "$RUNNER_TEMP/Chirp.app"
          plutil -lint "$RUNNER_TEMP/Chirp.app/Contents/Info.plist"
          sha1=$(./scripts/gen-macos-signing-cert.sh "$RUNNER_TEMP/cert" "Chirp CI Signing" | tail -1)
          ./scripts/sign-macos-app.sh "$RUNNER_TEMP/Chirp.app" "$RUNNER_TEMP/cert/chirp-signing.p12" "$RUNNER_TEMP/cert/chirp-signing.p12.pass" "$sha1"

  # What docs/relay.md tells people to run on a server: the container image,
  # the install scripts and the Quadlet units. None of it is Go, so nothing
  # above would notice it breaking. The Proxmox script needs a Proxmox node
  # and is only linted here.
  relay-deploy:
    name: Relay image & deploy files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the deploy scripts
        run: shellcheck -x deploy/install.sh deploy/proxmox/create-ct.sh deploy/proxmox/check-ct.sh deploy/proxy/setup-proxy.sh deploy/proxy/use-proxy.sh deploy/status/install.sh deploy/coturn/install.sh scripts/build-relay.sh scripts/build-status.sh scripts/check-relay.sh scripts/set-relay-dns.sh scripts/gen-macos-signing-cert.sh scripts/sign-macos-app.sh

      - name: Build the relay image
        run: podman build -f deploy/container/Containerfile -t localhost/chirp-relay:ci .

      # The image as the Quadlet unit runs it: read-only, no capabilities,
      # health checked by the binary itself, since the image has no shell.
      - name: The image serves and passes its health check
        run: |
          podman run -d --name relay --read-only --cap-drop all -p 127.0.0.1:8080:8080 \
            --health-cmd '["/usr/local/bin/chirp-relay","-healthcheck"]' localhost/chirp-relay:ci
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 0.5
          done
          podman healthcheck run relay
          curl -fsS -X POST -d '{"name":"ci"}' http://127.0.0.1:8080/api/peers | grep -q '"peer_id"'

      - name: The Quadlet units generate
        run: |
          dir="$(mktemp -d)"
          cp deploy/podman/*.container "$dir/"
          QUADLET_UNIT_DIRS="$dir" /usr/libexec/podman/quadlet -dryrun -user > "$dir/out"
          grep -q '^ExecStart=.*chirp-relay' "$dir/out"
          grep -q '^ExecStart=.*caddy' "$dir/out"
