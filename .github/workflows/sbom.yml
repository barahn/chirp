name: SBOM

# An SBOM is only useful if it describes something that was actually shipped,
# so this runs on release tags and attaches the result to the release. Chirp
# has no cmd/ entry point yet (see README), so today the SBOM describes the
# module graph; once a binary exists, the same job covers it.
on:
  push:
    tags: [ 'v*.*.*' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SPDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the SBOM to the release
      # anchore/sbom-action lists this workflow's runs before it uploads a
      # release asset. Without it, a published release fails with "Resource
      # not accessible by integration" (it did for v0.2.0). Read-only.
      actions: read
    steps:
      # Audit mode: harden-runner records what each job talks to without
      # blocking it. Read the egress report on a few green runs, then turn this
      # to `block` with an allowlist -- flipping it blind breaks the module
      # proxy, the linter and the action downloads all at once.
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        # An observer must not be able to fail the build it observes. In audit
        # mode this step blocks nothing, so if the agent cannot start -- as on a
        # private repository its tier does not cover -- the job goes on without
        # the egress report rather than going red.
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      - name: Populate the module graph
        run: go mod download

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: chirp-sbom.spdx.json
          output-file: chirp-sbom.spdx.json
          upload-release-assets: true
