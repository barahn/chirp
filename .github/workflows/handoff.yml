# Keeps HANDOFF.md's factual snapshot in step with main.
#
# HANDOFF.md is the prompt a continuation agent is handed when it picks the
# project up. Its prose (roadmap, constraints, known defects) is written by
# hand; its snapshot of the tree -- commit log, tracked files, dependencies,
# test state -- goes stale the moment anything merges. This job regenerates
# that block on every push to main and commits the result back.
#
# Why this cannot loop: the push below is authenticated with GITHUB_TOKEN, and
# GitHub does not start workflow runs for pushes made with it. The
# paths-ignore is a second, independent guard, not the mechanism.
name: Handoff

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'HANDOFF.md'
  # Available by hand for the case where a refresh is wanted without a push,
  # e.g. after editing the generator itself.
  workflow_dispatch:

concurrency:
  # Never two refreshes racing to commit to the same branch.
  group: handoff-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh HANDOFF.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit log goes into the snapshot, so the history has to be
          # there to read. Credentials are kept: this job pushes.
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Regenerate the snapshot
        run: ./scripts/gen-handoff.sh HANDOFF.md

      - name: Commit if it changed
        env:
          # CONTRIBUTING.md requires a DCO sign-off on every commit, and CI
          # enforces it on pull requests. This commit is generated from the
          # tree it is committed to -- it contributes no authored code -- but it
          # carries the trailer anyway so no commit on main is an exception.
          SIGNOFF: "Signed-off-by: chirp-handoff[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
        run: |
          if git diff --quiet -- HANDOFF.md; then
            echo "HANDOFF.md is already current; nothing to commit."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add HANDOFF.md
          git commit -m "chore(handoff): refresh the repository snapshot" \
                     -m "Regenerated from ${GITHUB_SHA} by scripts/gen-handoff.sh." \
                     -m "$SIGNOFF"

          # A push that races another job's commit should retry against the new
          # tip rather than fail the run: the snapshot is derived, so rebasing
          # it costs nothing.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✓ pushed the refreshed snapshot."
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto the new tip."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || {
              git rebase --abort || true
              echo "::error::Could not rebase the handoff refresh onto ${GITHUB_REF_NAME}."
              exit 1
            }
            sleep $((attempt * 4))
          done

          echo "::error::Failed to push the refreshed HANDOFF.md after 3 attempts."
          exit 1
