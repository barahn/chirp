name: CodeQL

# Static analysis that is not gosec. gosec matches known-bad Go patterns;
# CodeQL follows data from a source to a sink across function and package
# boundaries, which is how an untrusted PIN or session identifier reaching a
# command, a path or a log would be caught. They overlap, and neither one
# subsumes the other.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Queries improve without the code changing, so re-scan weekly rather than
    # only on push. Wednesday 04:17 UTC -- off the hour, where runner capacity
    # is not contended.
    - cron: '17 4 * * 3'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Gated on the CODE_SCANNING repository variable, which is off by default.
#
# This repository is private. On a private repository GitHub runs CodeQL and
# dependency review only with GitHub Advanced Security (Code Security): without
# it dependency review refuses outright, and CodeQL's analysis runs but its
# upload is refused. The CodeQL licence also permits analysing private code only
# under that entitlement, so running it here without one is not merely noisy.
#
# Set Settings -> Secrets and variables -> Actions -> Variables ->
# CODE_SCANNING = true once the repository is public or Code Security is enabled.
# Until then the gate is off -- and says so on every run, rather than going
# quietly green. See docs/devsecops.md.

jobs:
  analyze:
    name: Analyze (Go)
    if: vars.CODE_SCANNING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Uploading the SARIF result is what puts findings in the Security tab.
      security-events: write
      contents: read
      actions: read
    steps:
      # Audit mode: harden-runner records what each job talks to without
      # blocking it. Read the egress report on a few green runs, then turn this
      # to `block` with an allowlist -- flipping it blind breaks the module
      # proxy, the linter and the action downloads all at once.
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        # An observer must not be able to fail the build it observes. In audit
        # mode this step blocks nothing, so if the agent cannot start -- as on a
        # private repository its tier does not cover -- the job goes on without
        # the egress report rather than going red.
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      # cmd/chirp draws its window with Fyne, which needs cgo and the system's
      # OpenGL, X11 and Wayland headers to build (HANDOFF §5.6). Autobuild
      # compiles it, so the headers go in first.
      - name: Install Fyne's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: go
          # security-extended adds the lower-precision security queries. On a
          # codebase this small the extra noise is affordable; missing an
          # injection path in the consent flow is not.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:go

  gate-disabled:
    name: CodeQL (disabled)
    if: vars.CODE_SCANNING != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report that this gate is off
        run: |
          echo "::warning title=CodeQL is not running::This repository is private and the CODE_SCANNING variable is not set, so CodeQL is skipped. Enable it once the repository is public or Code Security is on. See docs/devsecops.md."
